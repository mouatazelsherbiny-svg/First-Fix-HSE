<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Fix · AI Office 3D</title>
<style>
  :root { --bg:#0b0b0e; --panel:#141418; --line:rgba(255,255,255,.09); --text:#f4f4f5; --muted:#a1a1aa; --orange:#f36f24; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 360px; height:100%; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; } header h1 b { color:var(--orange); }
  .conn { margin-inline-start:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:#71717a; }
  .dot.ok { background:#22c55e; box-shadow:0 0 8px #22c55e; } .dot.bad { background:#ef4444; box-shadow:0 0 8px #ef4444; }
  .btn { background:#1f1f25; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--orange); } .btn.on { background:var(--orange); border-color:var(--orange); }
  .left { display:flex; flex-direction:column; min-width:0; }
  .stage { flex:1; position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 40%, #23232b, #0b0b0e 75%); }
  .stage canvas { display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .lbl { display:flex; flex-direction:column; align-items:center; gap:6px; transform:translateY(-6px); }
  .tag { white-space:nowrap; font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; color:#fff; background:var(--c); box-shadow:0 2px 8px rgba(0,0,0,.45); }
  .bubble { position:relative; width:max-content; max-width:200px; padding:6px 10px; border-radius:12px; background:rgba(255,255,255,.96); color:#111827; font-size:11.5px; font-weight:600; line-height:1.3; box-shadow:0 6px 18px rgba(0,0,0,.35); border:2px solid var(--c); text-align:center; transition:opacity .3s; }
  .bubble::after { content:""; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%); border:7px solid transparent; border-top-color:var(--c); border-bottom:0; }
  .bubble small { display:block; font-size:9.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--c); }
  .bubble.empty { opacity:0; }
  .bubble.pop { animation:pop .35s; }
  @keyframes pop { 0% { transform:scale(.6); } 70% { transform:scale(1.08); } 100% { transform:scale(1); } }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:var(--muted); font-size:13px; background:var(--bg); z-index:5; transition:opacity .6s; }
  .loading .bar { width:220px; height:4px; border-radius:2px; background:#27272a; overflow:hidden; } .loading .bar i { display:block; height:100%; width:0; background:var(--orange); transition:width .2s; }
  .help { position:absolute; left:14px; bottom:12px; font-size:11.5px; color:rgba(255,255,255,.55); pointer-events:none; }
  .hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fde68a; font-size:12.5px; padding:8px 14px; border-radius:10px; display:none; z-index:6; }
  aside { border-inline-start:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside h2 { margin:0; padding:14px 16px 8px; font-size:13px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); }
  .roster { padding:0 12px; display:grid; gap:8px; }
  .card { display:grid; grid-template-columns:12px 1fr auto; gap:4px 10px; align-items:center; padding:9px 12px; border-radius:10px; background:#1b1b21; border:1px solid var(--line); cursor:pointer; }
  .card:hover { border-color:var(--c); }
  .card .sw { width:12px; height:12px; border-radius:50%; background:var(--c); } .card .nm { font-weight:700; }
  .card .tk { grid-column:2 / 4; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; padding:2px 8px; border-radius:999px; }
  .s-working { background:rgba(243,111,36,.2); color:#ff9a5c; } .s-meeting { background:rgba(56,189,248,.18); color:#7dd3fc; }
  .s-testing { background:rgba(34,197,94,.18); color:#86efac; } .s-idle { background:rgba(161,161,170,.18); color:#d4d4d8; }
  .log { flex:1; overflow-y:auto; padding:4px 12px 16px; min-height:0; }
  .row { display:grid; grid-template-columns:56px 1fr; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:12.5px; animation:fadein .5s; }
  .row time { color:var(--muted); font-variant-numeric:tabular-nums; font-size:11.5px; } .row b { color:var(--c); }
  .empty-log { color:var(--muted); font-size:12.5px; padding:12px 4px; }
  @keyframes fadein { from { opacity:0; transform:translateY(-4px); } }
  @media (max-width:900px) { .app { grid-template-columns:1fr; grid-template-rows:62% 38%; } aside { border-inline-start:0; border-top:1px solid var(--line); } }
</style>

<body>
<div class="app">
  <div class="left">
    <header>
      <h1><b>First Fix</b> · AI Office</h1>
      <button class="btn" id="demoBtn" title="Simulate the team to preview the animation">Demo</button>
      <button class="btn" id="camBtn" title="Reset the camera">Reset view</button>
      <a class="btn" href="index-2d.html" title="The simple 2D board">2D</a>

    <h2 style="padding-top:18px">Activity log</h2>
    <div class="log" id="log"><div class="empty-log">No activity yet.</div></div>
  </aside>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const TEAM = [
  { id: "project-manager", name: "Project Manager", color: "#f36f24", hat: "#f8fafc" },
  { id: "frontend-dev", name: "Frontend Dev", color: "#8b5cf6", hat: "#facc15" },
  { id: "backend-dev", name: "Backend Dev", color: "#0ea5e9", hat: "#facc15" },
  { id: "mobile-dev", name: "Mobile Dev", color: "#ec4899", hat: "#facc15" },
  { id: "qa-tester", name: "QA Tester", color: "#22c55e", hat: "#facc15" },
];
const STATES = ["working", "meeting", "testing", "idle"];
const params = new URLSearchParams(location.search);

/* ================= renderer / scene ================= */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById("labels") });

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const HOME_POS = new THREE.Vector3(0.3, 18.5, 19.5), HOME_TGT = new THREE.Vector3(0.3, 0, 0.6);
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.maxPolarAngle = 1.32;
controls.minDistance = 5;
controls.maxDistance = 45;
controls.update();

scene.add(new THREE.HemisphereLight(0xfff6ea, 0x3a3f4a, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(-9, 20, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 1, far: 60 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe3ff, 0.55);
fill.position.set(12, 10, -6);
scene.add(fill);

/* ================= helpers ================= */
const MAT = {};
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function rnd(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }
function std(color, o = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0, ...o }); }
function add(mesh, x = 0, y = 0, z = 0, parent = scene) {
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function box(w, h, d, mat, x, y, z, parent) { return add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat), x, y, z, parent); }
function cyl(rt, rb, h, mat, x, y, z, parent, seg = 24) { return add(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat), x, y, z, parent); }
function rbox(w, h, d, r, mat, x, y, z, parent) {
  const s = new THREE.Shape(), hw = w / 2 - r, hd = d / 2 - r;
  s.moveTo(-hw, -d / 2); s.lineTo(hw, -d / 2); s.quadraticCurveTo(w / 2, -d / 2, w / 2, -hd); s.lineTo(w / 2, hd);
  s.quadraticCurveTo(w / 2, d / 2, hw, d / 2); s.lineTo(-hw, d / 2); s.quadraticCurveTo(-w / 2, d / 2, -w / 2, hd);
  s.lineTo(-w / 2, -hd); s.quadraticCurveTo(-w / 2, -d / 2, -hw, -d / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2, curveSegments: 10 });
  g.rotateX(Math.PI / 2); g.translate(0, h / 2, 0);
  return add(new THREE.Mesh(g, mat), x, y, z, parent);
}

/* ---- textures ---- */
const woodFloor = canvasTex(1024, 1024, (g, w, h) => {
  const r = rnd(7);
  for (let y = 0; y < h; y += 64) for (let x = -((y / 64) % 3) * 170; x < w; x += 512) {
    const l = 52 + r() * 14;
    g.fillStyle = `hsl(30, 32%, ${l}%)`; g.fillRect(x, y, 510, 62);
    for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(90,55,25,${0.05 + r() * 0.08})`; g.beginPath(); const yy = y + r() * 62; g.moveTo(x, yy); g.bezierCurveTo(x + 170, yy + r() * 6 - 3, x + 340, yy + r() * 6 - 3, x + 510, yy); g.stroke(); }
    g.fillStyle = "rgba(60,35,15,.35)"; g.fillRect(x, y + 62, 512, 2); g.fillRect(x + 510, y, 2, 64);
  }
}, [4, 4]);
const carpet = (base, seed) => canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const r = rnd(seed);
  for (let i = 0; i < 26000; i++) { g.fillStyle = `rgba(${r() < 0.5 ? "255,255,255" : "0,0,0"},${r() * 0.07})`; g.fillRect(r() * w, r() * h, 2, 2); }
  g.strokeStyle = "rgba(0,0,0,.08)"; g.lineWidth = 2;
  for (let x = 0; x <= w; x += 128) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); g.beginPath(); g.moveTo(0, x); g.lineTo(w, x); g.stroke(); }
}, [6, 3]);
const serverFloor = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#3a3f48"; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 128) for (let y = 0; y < h; y += 128) {
    g.fillStyle = (x + y) % 256 ? "#444a55" : "#40464f"; g.fillRect(x + 3, y + 3, 122, 122);
    g.fillStyle = "rgba(0,0,0,.35)"; for (let k = 0; k < 6; k++) for (let j = 0; j < 6; j++) g.fillRect(x + 20 + k * 16, y + 20 + j * 16, 6, 6);
  }
}, [4, 3]);
const woodTop = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = "#b9875a"; g.fillRect(0, 0, w, h);
  const r = rnd(3);
  for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(110,65,30,${0.06 + r() * 0.12})`; g.lineWidth = 1 + r() * 2; g.beginPath(); const y = r() * h; g.moveTo(0, y); g.bezierCurveTo(w / 3, y + r() * 14 - 7, (2 * w) / 3, y + r() * 14 - 7, w, y + r() * 6 - 3); g.stroke(); }
});
const darkWood = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = "#5b3a24"; g.fillRect(0, 0, w, h);
  const r = rnd(11);
  for (let i = 0; i < 80; i++) { g.strokeStyle = `rgba(30,15,5,${0.08 + r() * 0.15})`; g.lineWidth = 1 + r() * 2; g.beginPath(); const y = r() * h; g.moveTo(0, y); g.bezierCurveTo(w / 3, y + r() * 10 - 5, (2 * w) / 3, y + r() * 10 - 5, w, y); g.stroke(); }
});
const fabric = (c) => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = c; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 3) { g.fillStyle = `rgba(0,0,0,${y % 6 ? 0.05 : 0.1})`; g.fillRect(0, y, w, 1); }
  for (let x = 0; x < w; x += 3) { g.fillStyle = "rgba(255,255,255,.03)"; g.fillRect(x, 0, 1, h); }
}, [2, 2]);

MAT.wall = std("#eceae6", { roughness: 0.95 });
MAT.wallDark = std("#2b2e35", { roughness: 0.9 });
MAT.trim = std("#d4d0c8");
MAT.metal = std("#9aa0a8", { metalness: 0.85, roughness: 0.32 });
MAT.chrome = std("#d7dbe0", { metalness: 1, roughness: 0.18 });
MAT.black = std("#18181b", { roughness: 0.45 });
MAT.plastic = std("#2a2c31", { roughness: 0.5 });
MAT.white = std("#f3f4f6", { roughness: 0.45 });
MAT.desk = std("#ffffff", { map: woodTop, roughness: 0.55 });
MAT.darkDesk = std("#ffffff", { map: darkWood, roughness: 0.4 });
MAT.chair = std("#ffffff", { map: fabric("#2f3440"), roughness: 0.95 });
MAT.sofa = std("#ffffff", { map: fabric("#d9612a"), roughness: 0.95 });
MAT.cushion = std("#ffffff", { map: fabric("#e7e2d8"), roughness: 0.95 });
MAT.glass = new THREE.MeshPhysicalMaterial({ color: 0xcfe8ff, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.2, envMapIntensity: 1.5, side: THREE.DoubleSide, depthWrite: false });
MAT.leaf = std("#2f8f46", { roughness: 0.65 });
MAT.leaf2 = std("#3fa857", { roughness: 0.65 });
MAT.pot = std("#e6e1d8", { roughness: 0.6 });
MAT.soil = std("#3b2a1d", { roughness: 1 });
MAT.rack = std("#1d2026", { metalness: 0.5, roughness: 0.45 });
MAT.counter = std("#f5f3ef", { roughness: 0.3 });
MAT.cabinet = std("#3d4451", { roughness: 0.55 });

/* ================= building ================= */
const W = 24, D0 = -7, D1 = 8; // x: -12..12, z: -7..8
const floorGroup = new THREE.Group(); scene.add(floorGroup);
function floor(x0, x1, z0, z1, mat, y = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), mat);
  m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); m.receiveShadow = true;
  floorGroup.add(m); return m;
}
// slab under everything (gives the cut-away building some thickness)
box(W + 0.6, 0.4, D1 - D0 + 0.6, std("#2a2b30"), 0, -0.21, (D0 + D1) / 2).castShadow = false;
floor(-12, 12, -7, -1.5, std("#ffffff", { map: carpet("#5f6b7a", 5), roughness: 1 }));      // dev floor carpet
floor(-12, 12, -1.5, 1.6, std("#ffffff", { map: woodFloor, roughness: 0.55 }));               // hallway wood
floor(-12, -3.6, 1.6, 8, std("#ffffff", { map: carpet("#6f7f72", 9), roughness: 1 }));        // meeting carpet
floor(-3.6, 3.8, 1.6, 8, std("#ffffff", { map: woodFloor, roughness: 0.55 }));                 // coffee wood
floor(3.8, 12, 1.6, 8, std("#ffffff", { map: serverFloor, roughness: 0.7, metalness: 0.2 }));  // server tiles

// back wall with windows
const wallH = 3.0;
box(W, wallH, 0.2, MAT.wall, 0, wallH / 2, D0 - 0.1);
const sky = canvasTex(512, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#8ec5ff"); gr.addColorStop(0.7, "#dbeeff"); gr.addColorStop(1, "#f6e7cf");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const r = rnd(21);
  for (let i = 0; i < 9; i++) { const x = r() * w, bh = 30 + r() * 90; g.fillStyle = `rgba(90,110,140,${0.25 + r() * 0.2})`; g.fillRect(x, h - bh, 20 + r() * 40, bh); }
});
for (const x of [-9, -3, 3, 9]) {
  const win = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 1.45), new THREE.MeshBasicMaterial({ map: sky }));
  win.position.set(x, 1.6, D0 + 0.005); scene.add(win);
  box(3.8, 0.08, 0.12, MAT.trim, x, 0.86, D0 + 0.04); box(3.8, 0.08, 0.12, MAT.trim, x, 2.34, D0 + 0.04);
  for (const dx of [-1.85, 0, 1.85]) box(0.08, 1.55, 0.12, MAT.trim, x + dx, 1.6, D0 + 0.04);
}
// side walls (low so the camera sees in)
box(0.2, wallH, D1 - D0, MAT.wall, -12.1, wallH / 2, (D0 + D1) / 2);
box(0.2, 1.1, D1 - D0, MAT.wall, 12.1, 0.55, (D0 + D1) / 2);
// skirting
box(W, 0.1, 0.03, MAT.wallDark, 0, 0.05, D0 + 0.015);
// brand sign on the back wall
const sign = canvasTex(1024, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.font = "900 64px Segoe UI, Arial"; g.textBaseline = "middle";
  g.fillStyle = "#f36f24"; g.fillText("FIRST FIX", 40, h / 2);
  g.fillStyle = "#1f2937"; g.font = "700 44px Segoe UI, Arial"; g.fillText("·  HSE DIGITAL OFFICE", 400, h / 2 + 2);
});
const signM = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 0.55), new THREE.MeshStandardMaterial({ map: sign, transparent: true, roughness: 0.6 }));
signM.position.set(0, 2.68, D0 + 0.02); scene.add(signM);

/* ---- furniture ---- */
function plant(x, z, s = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  cyl(0.24, 0.18, 0.5, MAT.pot, 0, 0.25, 0, g);
  cyl(0.22, 0.22, 0.02, MAT.soil, 0, 0.49, 0, g);
  const r = rnd(Math.round(x * 100 + z * 7) + 99);
  for (let i = 0; i < 16; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), i % 2 ? MAT.leaf : MAT.leaf2);
    leaf.scale.set(0.55, 2.4 + r() * 1.2, 0.25);
    const a = r() * Math.PI * 2, tilt = 0.35 + r() * 0.5;
    leaf.position.set(Math.sin(a) * 0.12, 0.85 + r() * 0.3, Math.cos(a) * 0.12);
    leaf.rotation.set(Math.cos(a) * tilt, a, -Math.sin(a) * tilt * 0.2);
    leaf.rotation.order = "YXZ"; leaf.rotation.set(tilt, a, 0);
    add(leaf, leaf.position.x, leaf.position.y, leaf.position.z, g);
  }
  return g;
}
function officeChair(x, z, yaw) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const leg = box(0.05, 0.04, 0.32, MAT.chrome, Math.sin(a) * 0.16, 0.08, Math.cos(a) * 0.16, g); leg.rotation.y = a;
    const wheel = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), MAT.black); add(wheel, Math.sin(a) * 0.31, 0.035, Math.cos(a) * 0.31, g);
  }
  cyl(0.03, 0.03, 0.34, MAT.chrome, 0, 0.27, 0, g);

function makeActor(def, i, gltf, clips) {
  const root = new THREE.Group();
  const model = SkeletonUtils.clone(gltf.scene);
  root.add(model);
  const bones = {};
  model.traverse((o) => {
    if (o.isBone) bones[o.name.replace("mixamorig", "").replace(":", "")] = o;
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      const isJoint = /Joints/i.test(o.material.name);
      o.material = new THREE.MeshPhysicalMaterial(isJoint
        ? { color: 0x2b2f36, roughness: 0.45, metalness: 0.4 }
        : { color: new THREE.Color(def.color), roughness: 0.42, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.35 });
    }
  });
  // HSE hard hat on the head bone
  const head = bones.Head;
  model.updateMatrixWorld(true);
  const ws = new THREE.Vector3(); head.getWorldScale(ws);
  const hat = new THREE.Group(); hat.scale.setScalar(1 / ws.x);
  const hatMat = new THREE.MeshPhysicalMaterial({ color: def.hat, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.15 });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.125, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), hatMat); dome.scale.set(1, 0.9, 1.12); dome.castShadow = true;
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.155, 0.012, 32), hatMat); brim.scale.set(1, 1, 1.2); brim.position.set(0, 0.0, 0.03); brim.castShadow = true;
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.03, 0.27), hatMat); ridge.position.set(0, 0.11, 0.0);
  hat.add(dome, brim, ridge);
  hat.position.set(0, 0.128 / ws.x, 0.012 / ws.x);
  head.add(hat);
  // label
  const el = document.createElement("div");
  el.className = "lbl"; el.style.setProperty("--c", def.color);
  el.innerHTML = `<div class="bubble empty"></div><div class="tag">${def.name}</div>`;
  const label = new CSS2DObject(el); label.position.set(0, 2.15, 0); root.add(label);

  const mixer = new THREE.AnimationMixer(model);
  const act = {};
  for (const n of ["idle", "walk", "agree", "headShake"]) act[n] = mixer.clipAction(clips[n]);
  act.agree.setLoop(THREE.LoopOnce, 1); act.agree.clampWhenFinished = false;
  act.headShake.setLoop(THREE.LoopOnce, 1);
  act.idle.play();
  act.idle.time = i * 0.7;
  const s = SPOTS[def.id].idle;
  root.position.set(s.x, 0, s.z); root.rotation.y = s.face;
  scene.add(root);
  actors[def.id] = { def, i, root, model, bones, mixer, act, cur: act.idle, label, bubble: el.querySelector(".bubble"),
    path: [], spot: s, state: "idle", task: "", time: "", sit: 0, type: 0, gesture: 3 + i * 1.7 };
}

function play(ac, name, fade = 0.3) {
  const next = ac.act[name];
  if (ac.cur === next) return;
  next.reset().setEffectiveWeight(1).fadeIn(fade).play();
  ac.cur.fadeOut(fade);
  ac.cur = next;
}

function routeTo(ac, spot) {
  const from = ac.spot, lane = HALL - 0.6 + ac.i * 0.3;
  const pts = [];
  if (ac.path.length) { /* re-route from where we are */ } else for (const p of [...from.approach].reverse()) pts.push(p);
  const first = spot.approach[0];
  const lastX = pts.length ? pts.at(-1).x : ac.root.position.x;
  pts.push({ x: lastX, z: lane }, { x: first.x, z: lane });
  for (const p of spot.approach) pts.push(p);
  pts.push({ x: spot.x, z: spot.z });
  ac.path = pts; ac.spot = spot;
}

const tmpQ = new THREE.Quaternion(), AX = new THREE.Vector3(1, 0, 0), AZ = new THREE.Vector3(0, 0, 1), AY = new THREE.Vector3(0, 1, 0);
function rot(bone, axis, angle) { if (!bone || !angle) return; tmpQ.setFromAxisAngle(axis, angle); bone.quaternion.multiply(tmpQ); }
function angleLerp(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; }

function updateActor(ac, dt, t) {
  const wantSit = !ac.path.length && ac.spot.sit;

  if (ac.path.length && ac.sit > 0.01) { ac.sit = Math.max(0, ac.sit - dt * 2.2); play(ac, "idle"); }
  else if (ac.path.length) {
    const p = ac.path[0], pos = ac.root.position;
    const dx = p.x - pos.x, dz = p.z - pos.z, d = Math.hypot(dx, dz), step = 1.25 * dt;
    play(ac, "walk", 0.25);
    if (d > 0.001) ac.root.rotation.y = angleLerp(ac.root.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 9));
    if (d <= step) { pos.x = p.x; pos.z = p.z; ac.path.shift(); } else { pos.x += (dx / d) * step; pos.z += (dz / d) * step; }
    if (!ac.path.length) play(ac, "idle", 0.4);
  } else {
    ac.root.rotation.y = angleLerp(ac.root.rotation.y, ac.spot.face, Math.min(1, dt * 5));
    if (wantSit) ac.sit = Math.min(1, ac.sit + dt * 1.8);
    // small gestures
    ac.gesture -= dt;
    if (ac.gesture < 0) {
      ac.gesture = 5 + Math.random() * 6;
      if (ac.state === "meeting") playOnce(ac, "agree");
      else if (ac.state === "testing" && Math.random() < 0.5) playOnce(ac, "headShake");
      else if (ac.state === "idle" && Math.random() < 0.5) playOnce(ac, "agree");
    }
  }
  ac.mixer.update(dt);
  // ---- procedural pose on top of the clip: sitting, typing, hands on the table ----
  const s = smooth(ac.sit), B = ac.bones;
  if (s > 0) {
    ac.model.position.y = -0.44 * s;
    ac.model.position.z = -0.06 * s;
    ac.model.updateMatrixWorld(true);
    const yaw = ac.root.rotation.y;
    const fwd = V(Math.sin(yaw), 0, Math.cos(yaw)), side = V(Math.cos(yaw), 0, -Math.sin(yaw)), down = V(0, -1, 0);
    const mix = (...p) => { const v = new THREE.Vector3(); for (let k = 0; k < p.length; k += 2) v.addScaledVector(p[k], p[k + 1]); return v.normalize(); };
    // legs: thighs forward, shins down
    aim(B.LeftUpLeg, mix(fwd, 1, down, 0.12, side, 0.1), s); aim(B.LeftLeg, mix(down, 1, fwd, 0.18), s);
    aim(B.RightUpLeg, mix(fwd, 1, down, 0.12, side, -0.1), s); aim(B.RightLeg, mix(down, 1, fwd, 0.18), s);
    aim(B.LeftFoot, mix(fwd, 1, down, 0.35), s); aim(B.RightFoot, mix(fwd, 1, down, 0.35), s);

      aim(B.LeftForeArm, mix(fwd, 1, side, -0.35, down, 0.12 + Math.sin(ac.type * 21) * tap), w);
      aim(B.RightArm, mix(down, 1, fwd, 0.75, side, -0.12), w);
      aim(B.RightForeArm, mix(fwd, 1, side, 0.35, down, 0.12 + Math.sin(ac.type * 17 + 1) * tap), w);
      if (ac.state === "working") rot(B.Head, AX, 0.1 * w);

}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const _pq = new THREE.Quaternion(), _bq = new THREE.Quaternion(), _d = new THREE.Quaternion(), _ax = new THREE.Vector3(), _tq = new THREE.Quaternion(), _p0 = new THREE.Vector3(), _p1 = new THREE.Vector3();
/** Turn a bone (in world space) so its +Y axis points along dir; w blends with the animated pose. */
function aim(bone, dir, w) {
  if (!bone || w <= 0) return;
  bone.getWorldQuaternion(_bq);
  bone.parent.getWorldQuaternion(_pq);
  const child = bone.children.find((c) => c.isBone);
  if (!child) return;
  bone.getWorldPosition(_p0); child.getWorldPosition(_p1);
  _ax.subVectors(_p1, _p0).normalize();
  _d.setFromUnitVectors(_ax, dir);
  _tq.copy(_d).multiply(_bq);                 // wanted world rotation
  _tq.premultiply(_pq.invert());              // to local
  bone.quaternion.slerp(_tq, w);
  bone.updateMatrixWorld(true);
}
const smooth = (x) => x * x * (3 - 2 * x);
function playOnce(ac, name) {
  const a = ac.act[name];
  a.reset().setEffectiveWeight(1).fadeIn(0.3).play();
  ac.act.idle.fadeOut(0.3);
  ac.cur = a;
  const back = () => { ac.mixer.removeEventListener("finished", back); if (ac.cur === a && !ac.path.length) play(ac, "idle", 0.4); };
  ac.mixer.addEventListener("finished", back);
}

/* ================= state from status.json ================= */
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
const ago = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; if (!isFinite(s)) return ""; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; };

function apply(entry) {
  const ac = actors[entry.agent];
  if (!ac) return;
  const state = STATES.includes(entry.state) ? entry.state : "idle";
  const changedState = state !== ac.state, changedTask = (entry.task || "") !== ac.task;
  ac.state = state; ac.task = entry.task || ""; ac.time = entry.time || "";
  const mon = monitors[ac.def.id]; mon.screen.material.emissiveIntensity = state === "working" ? 1.0 : 0.15;
  if (changedState) routeTo(ac, SPOTS[ac.def.id][state]);
  const show = !!ac.task && state !== "idle"; // idle = name tag only, keeps the coffee corner readable
  ac.bubble.className = "bubble" + (show ? "" : " empty");
  ac.bubble.innerHTML = `<small>${state}</small>${esc(ac.task)}`;
  if (show && (changedTask || changedState)) { void ac.bubble.offsetWidth; ac.bubble.classList.add("pop"); }
}

let follow = null;
function renderRoster() {
  const box = document.getElementById("roster");
  box.innerHTML = TEAM.map((a) => {
    const ac = actors[a.id] || { state: "idle", task: "", time: "" };
    return `<div class="card" data-id="${a.id}" style="--c:${a.color}"><span class="sw"></span><span class="nm">${a.name}</span>
      <span class="pill s-${ac.state}">${ac.state}</span>
      <span class="tk" title="${esc(ac.task)}">${esc(ac.task || "—")}${ac.time ? " · " + ago(ac.time) : ""}</span></div>`;
  }).join("");
  box.querySelectorAll(".card").forEach((c) => (c.onclick = () => { follow = follow === c.dataset.id ? null : c.dataset.id; userMoved = true; }));
}
let logEntries = [], sig = "";
function renderLog() {
  const box = document.getElementById("log");
  if (!logEntries.length) { box.innerHTML = '<div class="empty-log">No activity yet.</div>'; return; }
  box.innerHTML = logEntries.slice(-80).reverse().map((e) => {
    const a = TEAM.find((t) => t.id === e.agent) || { name: e.agent, color: "#a1a1aa" };
    return `<div class="row" style="--c:${a.color}"><time>${hhmm(e.time)}</time><div><b>${esc(a.name)}</b> <span class="pill s-${esc(e.state)}">${esc(e.state)}</span><br>${esc(e.task || "")}</div></div>`;
  }).join("");
}
function normalise(data) {
  if (Array.isArray(data)) { const latest = {}; data.forEach((e) => e && e.agent && (latest[e.agent] = e)); return { agents: latest, log: data }; }
  if (data && data.agent) return { agents: { [data.agent]: data }, log: [data] };
  return { agents: (data && data.agents) || {}, log: data && Array.isArray(data.log) ? data.log : [] };
}
function ingest(data) {
  const { agents, log } = normalise(data);
  Object.values(agents).forEach(apply);
  let entries = (log.length ? log : Object.values(agents)).filter((e) => e && e.agent).sort((a, b) => String(a.time).localeCompare(String(b.time)));
  const s = JSON.stringify(entries.slice(-80));
  if (s !== sig) { sig = s; logEntries = entries; renderLog(); }
  renderRoster();
}
const dot = document.getElementById("dot"), connText = document.getElementById("connText"), hint = document.getElementById("hint");
let demo = false, demoTimer = null, demoLog = [];
async function poll() {
  if (demo) return;
  try {
    const r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const txt = await r.text();
    ingest(txt.trim() ? JSON.parse(txt) : {});
    dot.className = "dot ok"; connText.textContent = "Live · updated " + new Date().toLocaleTimeString(); hint.style.display = "none";
  } catch { dot.className = "dot bad"; connText.textContent = "Can't read status.json"; if (location.protocol === "file:") hint.style.display = "block"; }
}
const DEMO_TASKS = {
  "project-manager": ["Planning HSE Performance page", "Reviewing PR from frontend", "Splitting tasks for the team"],
  "frontend-dev": ["Building Performance dashboard", "Styling summary cards", "Fixing chart labels"],
  "backend-dev": ["Adding hse_performance table", "Writing RLS policies", "Migrating priority values"],
  "mobile-dev": ["Daily observations form", "Permit to Work signatures", "Zoom-to-fit on phones"],
  "qa-tester": ["Running next build", "Typecheck + diff review", "Testing Word/PDF export"],
};
function pushDemo(e) { demoLog.push(e); const ag = {}; demoLog.forEach((x) => (ag[x.agent] = x)); ingest({ agents: ag, log: demoLog }); }
function demoStep() {
  const a = TEAM[Math.floor(Math.random() * TEAM.length)];
  const pool = a.id === "qa-tester" ? ["testing", "testing", "idle", "meeting"] : a.id === "project-manager" ? ["meeting", "working", "idle"] : ["working", "working", "meeting", "idle", "testing"];
  const state = pool[Math.floor(Math.random() * pool.length)];
  const task = state === "idle" ? "Coffee break" : state === "meeting" ? "Sprint meeting" : DEMO_TASKS[a.id][Math.floor(Math.random() * 3)];
  pushDemo({ agent: a.id, state, task, time: new Date().toISOString() });
}
document.getElementById("demoBtn").onclick = (ev) => {
  demo = !demo;
  ev.target.classList.toggle("on", demo); ev.target.textContent = demo ? "Stop demo" : "Demo";
  if (demo) {
    demoLog = []; sig = ""; dot.className = "dot"; connText.textContent = "Demo mode";
    TEAM.forEach((a, i) => setTimeout(() => demo && pushDemo({ agent: a.id, state: i === 0 ? "meeting" : i === 4 ? "testing" : "working", task: DEMO_TASKS[a.id][0], time: new Date().toISOString() }), i * 600));
    demoTimer = setInterval(demoStep, 4000);
  } else { clearInterval(demoTimer); sig = ""; poll(); }
};
document.getElementById("camBtn").onclick = () => { follow = null; userMoved = false; camera.position.copy(HOME_POS); controls.target.copy(HOME_TGT); };

/* ================= loop ================= */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w / h < 1.2 ? 50 : 38;
  camera.updateProjectionMatrix();
  // fit the whole floor (24 m wide) into the view
  const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const dist = Math.max(20, 14.3 / Math.tan(hf / 2));
  HOME_POS.copy(HOME_TGT).addScaledVector(new THREE.Vector3(0.01, 0.69, 0.72).normalize(), dist);
  if (!userMoved) { camera.position.copy(HOME_POS); controls.target.copy(HOME_TGT); }
}
let userMoved = false;
controls.addEventListener("start", () => (userMoved = true));
addEventListener("resize", resize); resize();

let ledT = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  for (const ac of Object.values(actors)) updateActor(ac, dt, t);
  for (const id in monitors) { const m = monitors[id]; if (actors[id]?.state === "working") m.tex.offset.y -= dt * 0.04; }
  qaMon.forEach((m) => (m.tex.offset.y -= dt * 0.02));
  ledT += dt;
  if (ledT > 0.15) { ledT = 0; for (let k = 0; k < 6; k++) { const l = leds[Math.floor(Math.random() * leds.length)]; l.visible = !l.visible; } }
  if (follow && actors[follow]) {
    const p = actors[follow].root.position;
    const goal = new THREE.Vector3(p.x, 0.9, p.z);
    controls.target.lerp(goal, Math.min(1, dt * 3));
    const off = new THREE.Vector3(p.x + 2.5, 5.5, p.z + 6.5);
    camera.position.lerp(off, Math.min(1, dt * 2));
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function start() {
  renderRoster();
  if (params.get("pose")) { // debug: ?pose=working etc.
    TEAM.forEach((a) => apply({ agent: a.id, state: params.get("pose"), task: "Debug pose", time: new Date().toISOString() }));
    for (const ac of Object.values(actors)) { ac.path = []; ac.root.position.set(ac.spot.x, 0, ac.spot.z); ac.root.rotation.y = ac.spot.face; ac.sit = ac.spot.sit ? 1 : 0; play(ac, "idle", 0); }
    renderRoster();

  }
  poll();
  setInterval(poll, 3000);
  setInterval(renderRoster, 30000);
}
renderRoster();
requestAnimationFrame(frame);
window.__office = { actors, camera, controls, scene, apply, renderRoster };
