<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Fix · AI Office</title>
<style>
  :root {
    --bg: #0b0b0e; --panel: #141418; --line: rgba(255,255,255,.09); --text: #f4f4f5; --muted: #a1a1aa;
    --orange: #f36f24; --floor: #e9dcc6; --floor2: #e2d2b8; --wall: #3b3b44;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-columns: minmax(0,1fr) 360px; height: 100%; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header h1 b { color: var(--orange); }
  .conn { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #71717a; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .dot.bad { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .btn { background: #1f1f25; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--orange); }
  .btn.on { background: var(--orange); border-color: var(--orange); }
  .left { display: flex; flex-direction: column; min-width: 0; }
  .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .office { position: absolute; width: 1100px; height: 700px; transform-origin: 0 0; border-radius: 18px; overflow: hidden;
    background: repeating-linear-gradient(90deg, var(--floor) 0 54px, var(--floor2) 54px 56px); box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 10px var(--wall); }

  /* ---- rooms & furniture ---- */
  .zone { position: absolute; border-radius: 10px; }
  .label { position: absolute; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(0,0,0,.45); }
  .work { left: 10px; top: 10px; width: 1080px; height: 290px; background: repeating-linear-gradient(0deg, #d9e4ee 0 40px, #d2dee9 40px 42px); }
  .hall { left: 10px; top: 300px; width: 1080px; height: 80px; background: #cfc3ae; border-top: 4px solid #b8aa92; border-bottom: 4px solid #b8aa92; }
  .hall::after { content: ""; position: absolute; left: 20px; right: 20px; top: 36px; border-top: 4px dashed rgba(255,255,255,.45); }
  .meet { left: 10px; top: 384px; width: 420px; height: 306px; background: repeating-linear-gradient(45deg, #c9d8c4 0 14px, #c3d3bd 14px 28px); border-right: 8px solid rgba(140,200,255,.55); }
  .meet::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: linear-gradient(90deg, rgba(140,200,255,.55) 0 35%, transparent 35% 65%, rgba(140,200,255,.55) 65%); }
  .coffee { left: 438px; top: 384px; width: 300px; height: 306px; background: repeating-linear-gradient(0deg, #ead9bf 0 24px, #e3cfb1 24px 26px); }
  .server { left: 746px; top: 384px; width: 344px; height: 306px; background: #2a2d36; background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 14px 14px; border-left: 8px solid #3b3b44; }
  .server .label { color: rgba(255,255,255,.5); }

  .desk { position: absolute; width: 150px; height: 74px; background: #8b5e3c; border-radius: 8px; box-shadow: 0 6px 0 #6d4529, 0 10px 16px rgba(0,0,0,.25); }
  .desk::before { content: ""; position: absolute; inset: 6px; border-radius: 5px; background: #a47148; }
  .monitor { position: absolute; left: 45px; top: 10px; width: 60px; height: 36px; background: #1c1c22; border-radius: 4px; border: 3px solid #2d2d35; overflow: hidden; }
  .monitor i { position: absolute; left: 4px; right: 4px; height: 3px; border-radius: 2px; background: var(--c, #f36f24); opacity: .8; animation: code 2.4s infinite; }
  .monitor i:nth-child(1) { top: 5px; width: 60%; } .monitor i:nth-child(2) { top: 12px; width: 75%; animation-delay: .4s; } .monitor i:nth-child(3) { top: 19px; width: 40%; animation-delay: .8s; }
  .monitor.off i { animation: none; opacity: .15; }
  @keyframes code { 0%,100% { transform: scaleX(1); transform-origin: left; } 50% { transform: scaleX(.55); transform-origin: left; } }
  .kb { position: absolute; left: 50px; top: 52px; width: 50px; height: 10px; background: #e5e7eb; border-radius: 3px; }
  .mug { position: absolute; left: 118px; top: 46px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--c, #f36f24); }
  .plant { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #4ade80, #15803d); box-shadow: 0 0 0 5px #92400e; }
  .chair { position: absolute; width: 44px; height: 40px; border-radius: 12px 12px 8px 8px; background: #374151; box-shadow: inset 0 -8px 0 #1f2937; }
  .nameplate { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 800; color: #334155; letter-spacing: .5px; }

  .table { position: absolute; left: 105px; top: 470px; width: 230px; height: 120px; border-radius: 60px; background: #7c4a2a; box-shadow: 0 8px 0 #5b3520, 0 14px 22px rgba(0,0,0,.25); }
  .table::after { content: ""; position: absolute; inset: 10px; border-radius: 50px; background: #93603a; }
  .screen { position: absolute; left: 150px; top: 396px; width: 140px; height: 14px; background: #111; border-radius: 3px; box-shadow: 0 0 12px rgba(56,189,248,.6); }
  .counter { position: absolute; left: 458px; top: 400px; width: 260px; height: 50px; background: #57534e; border-radius: 8px; box-shadow: 0 6px 0 #44403c; }
  .machine { position: absolute; left: 480px; top: 404px; width: 46px; height: 40px; background: #18181b; border-radius: 6px; }
  .machine::after { content: ""; position: absolute; left: 16px; top: 22px; width: 14px; height: 12px; background: #fff; border-radius: 0 0 5px 5px; }
  .steam { position: absolute; left: 497px; top: 380px; width: 10px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.7); filter: blur(3px); animation: steam 2.2s infinite; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-16px) scale(1.3); } }
  .fridge { position: absolute; left: 650px; top: 402px; width: 50px; height: 44px; background: #e5e7eb; border-radius: 6px; border: 3px solid #9ca3af; }
  .sofa { position: absolute; left: 470px; top: 618px; width: 236px; height: 52px; border-radius: 14px; background: var(--orange); box-shadow: inset 0 -12px 0 #c2510f, 0 6px 12px rgba(0,0,0,.2); }
  .rug { position: absolute; left: 500px; top: 486px; width: 176px; height: 104px; border-radius: 50%; background: repeating-radial-gradient(circle, #fcd9bd 0 10px, #f9c49a 10px 20px); opacity: .8; }
  .rack { position: absolute; top: 400px; width: 56px; height: 120px; background: #111318; border-radius: 6px; border: 3px solid #4b5563; padding: 8px 6px; display: grid; gap: 6px; }
  .rack b { display: block; height: 8px; border-radius: 2px; background: #1f2937; position: relative; }
  .rack b::after { content: ""; position: absolute; right: 3px; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: #22c55e; animation: blink 1s infinite; }
  .rack b:nth-child(2n)::after { background: #38bdf8; animation-delay: .3s; } .rack b:nth-child(3n)::after { background: var(--orange); animation-delay: .6s; }
  @keyframes blink { 50% { opacity: .15; } }
  .testbench { position: absolute; left: 790px; top: 560px; width: 270px; height: 46px; background: #475569; border-radius: 8px; box-shadow: 0 6px 0 #334155; }
  .testbench i { position: absolute; top: 8px; width: 40px; height: 28px; border-radius: 4px; background: #0f172a; box-shadow: 0 0 8px rgba(34,197,94,.5); }

  /* ---- characters ---- */
  .agent { position: absolute; width: 0; height: 0; z-index: 10; }
  .bodywrap { position: absolute; left: -22px; top: -62px; width: 44px; height: 66px; transition: transform .2s; }
  .agent.left .bodywrap { transform: scaleX(-1); }
  .shadow { position: absolute; left: -18px; top: -4px; width: 36px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.22); }
  .leg { position: absolute; top: 46px; width: 9px; height: 16px; border-radius: 4px; background: #27272a; transform-origin: top center; }
  .leg.l { left: 12px; } .leg.r { left: 23px; }
  .agent.walking .leg.l { animation: legL .42s infinite ease-in-out; }
  .agent.walking .leg.r { animation: legR .42s infinite ease-in-out; }
  @keyframes legL { 0%,100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }
  @keyframes legR { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(28deg); } }
  .torso { position: absolute; left: 7px; top: 24px; width: 30px; height: 26px; border-radius: 10px 10px 6px 6px; background: var(--c); box-shadow: inset -4px -4px 0 rgba(0,0,0,.18); }
  .arm { position: absolute; top: 27px; width: 8px; height: 18px; border-radius: 4px; background: var(--c); filter: brightness(.85); transform-origin: top center; }
  .arm.l { left: 2px; } .arm.r { left: 34px; }
  .agent.walking .arm.l { animation: legR .42s infinite ease-in-out; }
  .agent.walking .arm.r { animation: legL .42s infinite ease-in-out; }
  .agent.st-working:not(.walking) .arm, .agent.st-testing:not(.walking) .arm { animation: type .3s infinite alternate; }
  @keyframes type { to { transform: rotate(-35deg); } }
  .head { position: absolute; left: 9px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: #f1c27d; box-shadow: inset -3px -3px 0 rgba(0,0,0,.12); }
  .hair { position: absolute; left: 8px; top: -2px; width: 28px; height: 13px; border-radius: 14px 14px 4px 4px; background: var(--hair, #3f2a1d); }
  .eye { position: absolute; top: 12px; width: 4px; height: 5px; border-radius: 2px; background: #1f2937; animation: eyes 4s infinite; }
  .eye.a { left: 19px; } .eye.b { left: 27px; }
  @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .hat { position: absolute; left: 6px; top: -7px; width: 32px; height: 14px; border-radius: 16px 16px 3px 3px; background: #facc15; box-shadow: inset 0 -3px 0 #ca8a04; }
  .agent.bob:not(.walking) .bodywrap { animation: bob 2.6s infinite ease-in-out; }
  @keyframes bob { 50% { margin-top: -2px; } }
  .tag { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); white-space: nowrap; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--c); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .bubble { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); width: max-content; max-width: 190px; padding: 6px 10px; border-radius: 12px; background: #fff; color: #111827; font-size: 11.5px; font-weight: 600; line-height: 1.3; box-shadow: 0 4px 14px rgba(0,0,0,.3); border: 2px solid var(--c); text-align: center; transition: opacity .3s; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 7px solid transparent; border-top-color: var(--c); border-bottom: 0; }
  .bubble small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--c); }
  .bubble.empty { opacity: 0; }
  .bubble.pop { animation: pop .35s; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(.6); } 70% { transform: translateX(-50%) scale(1.08); } 100% { transform: translateX(-50%) scale(1); } }

  /* ---- side panel ---- */
  aside { border-inline-start: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { margin: 0; padding: 14px 16px 8px; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .roster { padding: 0 12px; display: grid; gap: 8px; }
  .card { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: #1b1b21; border: 1px solid var(--line); }
  .card .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .card .nm { font-weight: 700; }
  .card .tk { grid-column: 2 / 4; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 2px 8px; border-radius: 999px; }
  .s-working { background: rgba(243,111,36,.2); color: #ff9a5c; } .s-meeting { background: rgba(56,189,248,.18); color: #7dd3fc; }
  .s-testing { background: rgba(34,197,94,.18); color: #86efac; } .s-idle { background: rgba(161,161,170,.18); color: #d4d4d8; }
  .log { flex: 1; overflow-y: auto; padding: 4px 12px 16px; min-height: 0; }
  .row { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 12.5px; animation: fadein .5s; }
  .row time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .row b { color: var(--c); }
  .empty-log { color: var(--muted); font-size: 12.5px; padding: 12px 4px; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } }
  .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fde68a; font-size: 12.5px; padding: 8px 14px; border-radius: 10px; display: none; z-index: 50; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 60% 40%; } aside { border-inline-start: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <header>
      <h1><b>First Fix</b> · AI Office</h1>
      <button class="btn" id="demoBtn" title="Simulate the team to preview the animation">Demo</button>
      <div class="conn"><span class="dot" id="dot"></span><span id="connText">Connecting…</span></div>
    </header>
    <div class="stage" id="stage">
      <div class="office" id="office">
        <div class="zone work"><span class="label" style="left:14px;top:8px">Dev floor</span></div>
        <div class="zone hall"></div>
        <div class="zone meet"><span class="label" style="left:14px;bottom:8px">Meeting room</span></div>
        <div class="zone coffee"><span class="label" style="right:14px;bottom:8px;top:auto">Coffee corner</span></div>
        <div class="zone server"><span class="label" style="right:14px;bottom:8px">Server &amp; QA corner</span></div>
        <div id="furniture"></div>
        <div class="screen"></div>
        <div class="table"></div>
        <div class="rug"></div>
        <div class="counter"></div><div class="machine"></div><div class="steam"></div><div class="steam" style="left:507px;animation-delay:1.1s"></div>
        <div class="fridge"></div>
        <div class="sofa"></div>
        <div class="plant" style="left:30px;top:250px"></div><div class="plant" style="left:1040px;top:250px"></div>
        <div class="plant" style="left:30px;top:400px"></div><div class="plant" style="left:700px;top:560px"></div>
        <div class="testbench"><i style="left:16px"></i><i style="left:76px"></i><i style="left:136px"></i><i style="left:196px"></i></div>
        <div id="agents"></div>
      </div>
      <div class="hint" id="hint">Open this page with <b>start-office.bat</b> so it can read status.json.</div>
    </div>
  </div>
  <aside>
    <h2>Team</h2>
    <div class="roster" id="roster"></div>
    <h2 style="padding-top:18px">Activity log</h2>
    <div class="log" id="log"><div class="empty-log">No activity yet.</div></div>
  </aside>
</div>

<script>
(() => {
  const TEAM = [
    { id: "project-manager", name: "Moataz Elsherbiny", color: "#f36f24", hair: "#1f1f1f", hat: true },
    { id: "frontend-dev",    name: "Frontend Dev",    color: "#8b5cf6", hair: "#7c2d12" },
    { id: "backend-dev",     name: "Backend Dev",     color: "#0ea5e9", hair: "#3f2a1d" },
    { id: "mobile-dev",      name: "Mobile Dev",      color: "#ec4899", hair: "#111827" },
    { id: "qa-tester",       name: "QA Tester",       color: "#22c55e", hair: "#a16207" },
  ];
  const STATES = ["working", "meeting", "testing", "idle"];
  const HALL_Y = 340, SPEED = 150; // px per second

  // Spots per agent for every state.
  const SPOT = {};
  TEAM.forEach((a, i) => {
    const deskX = 40 + i * 212;
    SPOT[a.id] = {
      working: { x: deskX + 75, y: 205 },
      meeting: [{ x: 120, y: 455 }, { x: 220, y: 450 }, { x: 320, y: 455 }, { x: 160, y: 625 }, { x: 280, y: 625 }][i],
      testing: { x: 800 + i * 58, y: 552 },
      idle:    [{ x: 510, y: 500 }, { x: 590, y: 480 }, { x: 670, y: 500 }, { x: 540, y: 600 }, { x: 640, y: 600 }][i],
      deskX,
    };
  });

  // Furniture: desks with monitors, chairs and nameplates.
  const furn = document.getElementById("furniture");
  TEAM.forEach((a) => {
    const x = SPOT[a.id].deskX;
    furn.insertAdjacentHTML("beforeend",
      `<div class="desk" style="left:${x}px;top:110px;--c:${a.color}"><span class="nameplate">${a.name}</span>
         <div class="monitor off" id="mon-${a.id}"><i></i><i></i><i></i></div><div class="kb"></div><div class="mug"></div></div>
       <div class="chair" style="left:${x + 53}px;top:196px"></div>`);
  });
  [790, 860, 930, 1000].forEach((x) => {
    furn.insertAdjacentHTML("beforeend", `<div class="rack" style="left:${x}px">${"<b></b>".repeat(9)}</div>`);
  });

  // Characters.
  const layer = document.getElementById("agents");
  const actors = {};
  TEAM.forEach((a) => {
    const el = document.createElement("div");
    el.className = "agent bob st-idle";
    el.style.setProperty("--c", a.color);
    el.style.setProperty("--hair", a.hair);
    el.innerHTML = `<div class="shadow"></div>
      <div class="bubble empty"></div>
      <div class="bodywrap">
        <div class="leg l"></div><div class="leg r"></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="torso"></div>
        <div class="head"></div>${a.hat ? '<div class="hat"></div>' : '<div class="hair"></div>'}
        <div class="eye a"></div><div class="eye b"></div>
      </div>
      <div class="tag">${a.name}</div>`;
    layer.appendChild(el);
    const start = SPOT[a.id].idle;
    actors[a.id] = { def: a, el, bubble: el.querySelector(".bubble"), x: start.x, y: start.y, path: [], state: "idle", task: "", time: "" };
    place(actors[a.id]);
  });

  function place(ac) {
    ac.el.style.left = ac.x + "px";
    ac.el.style.top = ac.y + "px";
    ac.el.style.zIndex = 10 + Math.round(ac.y);
  }

  function routeTo(ac, target) {
    const lane = HALL_Y + (TEAM.indexOf(ac.def) - 2) * 7; // small lane offset so they don't overlap
    const pts = [];
    const sameZone = Math.abs(ac.y - target.y) < 40 && (target.y < HALL_Y) === (ac.y < HALL_Y);
    if (!sameZone) { pts.push({ x: ac.x, y: lane }, { x: target.x, y: lane }); }
    pts.push({ x: target.x, y: target.y });
    ac.path = pts;
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const ac of Object.values(actors)) {
      if (!ac.path.length) { ac.el.classList.remove("walking"); continue; }
      const t = ac.path[0];
      const dx = t.x - ac.x, dy = t.y - ac.y, d = Math.hypot(dx, dy), step = SPEED * dt;
      ac.el.classList.add("walking");
      if (Math.abs(dx) > 1) ac.el.classList.toggle("left", dx < 0);
      if (d <= step) { ac.x = t.x; ac.y = t.y; ac.path.shift(); }
      else { ac.x += (dx / d) * step; ac.y += (dy / d) * step; }
      place(ac);
      if (!ac.path.length) { ac.el.classList.remove("walking"); ac.el.classList.remove("left"); }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- state updates ----
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const hhmm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  const ago = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; if (!isFinite(s)) return ""; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; };

  function apply(entry) {
    const ac = actors[entry.agent];
    if (!ac) return;
    const state = STATES.includes(entry.state) ? entry.state : "idle";
    const changedState = state !== ac.state;
    const changedTask = (entry.task || "") !== ac.task;
    ac.state = state; ac.task = entry.task || ""; ac.time = entry.time || "";
    STATES.forEach((s) => ac.el.classList.toggle("st-" + s, s === state));
    document.getElementById("mon-" + ac.def.id).classList.toggle("off", state !== "working");
    if (changedState) routeTo(ac, SPOT[ac.def.id][state]);
    const show = ac.task && !(state === "idle" && /^idle$/i.test(ac.task));
    ac.bubble.className = "bubble" + (show ? "" : " empty");
    ac.bubble.innerHTML = `<small>${state}</small>${esc(ac.task)}`;
    if (show && (changedTask || changedState)) { void ac.bubble.offsetWidth; ac.bubble.classList.add("pop"); }
  }

  function renderRoster() {
    document.getElementById("roster").innerHTML = TEAM.map((a) => {
      const ac = actors[a.id];
      return `<div class="card" style="--c:${a.color}"><span class="sw"></span><span class="nm">${a.name}</span>
        <span class="pill s-${ac.state}">${ac.state}</span>
        <span class="tk" title="${esc(ac.task)}">${esc(ac.task || "—")}${ac.time ? " · " + ago(ac.time) : ""}</span></div>`;
    }).join("");
  }

  let logEntries = [];
  function renderLog() {
    const box = document.getElementById("log");
    if (!logEntries.length) { box.innerHTML = '<div class="empty-log">No activity yet.</div>'; return; }
    box.innerHTML = logEntries.slice(-80).reverse().map((e) => {
      const a = TEAM.find((t) => t.id === e.agent) || { name: e.agent, color: "#a1a1aa" };
      return `<div class="row" style="--c:${a.color}"><time>${hhmm(e.time)}</time><div><b>${esc(a.name)}</b> <span class="pill s-${esc(e.state)}">${esc(e.state)}</span><br>${esc(e.task || "")}</div></div>`;
    }).join("");
  }

  // Accept {agents:{...}, log:[...]}, a single {agent,...} object, or an array of entries.
  function normalise(data) {
    if (Array.isArray(data)) {
      const latest = {}; data.forEach((e) => e && e.agent && (latest[e.agent] = e));
      return { agents: latest, log: data };
    }
    if (data && data.agent) return { agents: { [data.agent]: data }, log: [data] };
    return { agents: (data && data.agents) || {}, log: (data && Array.isArray(data.log)) ? data.log : [] };
  }

  let sig = "";
  function ingest(data) {
    const { agents, log } = normalise(data);
    Object.values(agents).forEach(apply);
    let entries = log.length ? log : Object.values(agents);
    entries = entries.filter((e) => e && e.agent).sort((a, b) => String(a.time).localeCompare(String(b.time)));
    const s = JSON.stringify(entries.slice(-80));
    if (s !== sig) { sig = s; logEntries = entries; renderLog(); }
    renderRoster();
  }

  const dot = document.getElementById("dot"), connText = document.getElementById("connText"), hint = document.getElementById("hint");
  async function poll() {
    if (demo) return;
    try {
      const r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const txt = await r.text();
      ingest(txt.trim() ? JSON.parse(txt) : {});
      dot.className = "dot ok"; connText.textContent = "Live · updated " + new Date().toLocaleTimeString();
      hint.style.display = "none";
    } catch (e) {
      dot.className = "dot bad"; connText.textContent = "Can't read status.json";
      if (location.protocol === "file:") hint.style.display = "block";
    }
  }

  // ---- demo mode: simulates the team so the office can be previewed ----
  let demo = false, demoTimer = null, demoLog = [];
  const DEMO_TASKS = {
    "project-manager": ["Planning HSE Performance page", "Reviewing PR from frontend", "Splitting tasks for the team"],
    "frontend-dev": ["Building Performance dashboard", "Styling summary cards", "Fixing chart labels"],
    "backend-dev": ["Adding hse_performance table", "Writing RLS policies", "Migrating priority values"],
    "mobile-dev": ["Daily observations form", "Permit to Work signatures", "Zoom-to-fit on phones"],
    "qa-tester": ["Running next build", "Typecheck + diff review", "Testing Word/PDF export"],
  };
  function demoStep() {
    const a = TEAM[Math.floor(Math.random() * TEAM.length)];
    const pool = a.id === "qa-tester" ? ["testing", "testing", "idle", "meeting"] : a.id === "project-manager" ? ["meeting", "working", "idle"] : ["working", "working", "meeting", "idle", "testing"];
    const state = pool[Math.floor(Math.random() * pool.length)];
    const tasks = DEMO_TASKS[a.id];
    const task = state === "idle" ? "Coffee break ☕" : state === "meeting" ? "Sprint meeting" : tasks[Math.floor(Math.random() * tasks.length)];
    const e = { agent: a.id, state, task, time: new Date().toISOString() };
    demoLog.push(e);
    const agents = {}; demoLog.forEach((x) => (agents[x.agent] = x));
    ingest({ agents, log: demoLog });
  }
  document.getElementById("demoBtn").onclick = (ev) => {
    demo = !demo;
    ev.target.classList.toggle("on", demo);
    ev.target.textContent = demo ? "Stop demo" : "Demo";
    if (demo) {
      demoLog = []; sig = "";
      dot.className = "dot"; connText.textContent = "Demo mode";
      TEAM.forEach((a, i) => setTimeout(() => { if (demo) { demoLog.push({ agent: a.id, state: i === 0 ? "meeting" : "working", task: DEMO_TASKS[a.id][0], time: new Date().toISOString() }); const ag = {}; demoLog.forEach((x) => (ag[x.agent] = x)); ingest({ agents: ag, log: demoLog }); } }, i * 500));
      demoTimer = setInterval(demoStep, 2500);
    } else {
      clearInterval(demoTimer); sig = ""; poll();
    }
  };

  // ---- fit the office into the stage ----
  const stage = document.getElementById("stage"), office = document.getElementById("office");
  function fit() {
    const s = Math.min((stage.clientWidth - 24) / 1100, (stage.clientHeight - 24) / 700);
    office.style.transform = `scale(${s})`;
    office.style.left = (stage.clientWidth - 1100 * s) / 2 + "px";
    office.style.top = (stage.clientHeight - 700 * s) / 2 + "px";
  }
  addEventListener("resize", fit); fit();

  renderRoster();
  poll();
  setInterval(poll, 3000);
  setInterval(renderRoster, 30000);
})();
</script>
</body>
</html>
